name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build, test and package (ZIP + setup.exe)
        shell: pwsh
        run: ./build.ps1 -RequireInstaller

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: X3DCorePinner-win-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256

      # GitHub CLI (preinstalled on runners) instead of a third-party action:
      # explicit file list, fails loudly if any asset is missing, --clobber for re-runs.
      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|zip|sha256)$' } | ForEach-Object { $_.FullName })
          Write-Host "Assets:"; $files | ForEach-Object { Write-Host "  $_" }
          if (-not ($files | Where-Object { $_ -like '*-setup.exe' })) { throw 'setup.exe missing from dist' }
          if (-not ($files | Where-Object { $_ -like '*.zip' }))       { throw 'zip missing from dist' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "X3D Core Pinner $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
